<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="score-and-time">
        <p>Score: <span id="score">0</span></p>
        <p>Time: <span id="time">15</span>s</p>
    </div>
    <div class="question-box">
        <div class="q-a-div">
            <p>Questions Answered: <span id="questions-answered">0</span>/10</p>
        </div>
        <div class = "questions-div">
            <h2 id="questions"></h2>
            <p id="word"></p>
            <p id="word-two"></p>
        </div>
    </div>

    <div class="buttons">
        <div class="buttons-top">
            <button id="option1">Button A</button>
            <button id="option2">Button B</button>
        </div>
        <div class="buttons-bottom">
            <button id="option3">Button C</button>
            <button id="option4">Button D</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
